[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trot-bound-switch"
version = "0.1.0"
description = "SA16 forced Trot/Bound transition task for IsaacLab"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "BSD-3-Clause"}

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trot_bound_switch = [
  "assets/urdf/**/*.urdf",
  "assets/urdf/**/package.xml",
  "assets/urdf/**/*.STL",
  "pretrained/**/*.pt",
]
